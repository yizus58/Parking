spring.security.user.name=user
spring.security.user.password=password
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Slice tests on H2: Hibernate creates the schema (H2 cannot run the
# PostgreSQL migrations, e.g. partial indexes). The migrations themselves are
# exercised by the PostgreSQL tests (see support/TestPostgres).
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

# Values needed by JwtAuthenticationFilter in web slice tests
application.json=application/json
character.encoding=UTF-8
